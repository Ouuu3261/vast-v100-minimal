name: Build generic CUDA minimal image
on:
  push:
    branches: [main]
    paths: [Dockerfile, 'tools/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify Linux amd64 image
        run: |
          docker build --platform linux/amd64 -t ghcr.io/ouuu3261/vast-v100-minimal:cuda12.9.1-generic-v2 .
          docker run --rm --entrypoint bash ghcr.io/ouuu3261/vast-v100-minimal:cuda12.9.1-generic-v2 /opt/cuda-tools/verify-toolchain.sh
          docker image inspect ghcr.io/ouuu3261/vast-v100-minimal:cuda12.9.1-generic-v2 --format '{{json .}}' > image-inspect.json
          docker run --rm --entrypoint bash ghcr.io/ouuu3261/vast-v100-minimal:cuda12.9.1-generic-v2 -c 'dpkg-query -W' > package-inventory.txt
          docker run --rm --entrypoint bash ghcr.io/ouuu3261/vast-v100-minimal:cuda12.9.1-generic-v2 -c 'test -z "$(find /etc/ssh -maxdepth 1 -name "ssh_host_*" -type f -print -quit)"'
      - name: Publish to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push ghcr.io/ouuu3261/vast-v100-minimal:cuda12.9.1-generic-v2
      - uses: actions/upload-artifact@v4
        with:
          name: cuda-generic-image-build-evidence
          path: |
            image-inspect.json
            package-inventory.txt
